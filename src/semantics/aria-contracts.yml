  {
    "id": "semantics.composite-focus",
    "version": "1.0.0",
    "title": "Composite focus",
    "kind": "semantic",
    "requirement": "A composite widget contributes one predictable stop to the page tab sequence and manages focus inside with roving tabindex or aria-activedescendant using the conventional key model for its role. Roving tabindex leaves exactly one managed descendant at tabindex 0. Aria-activedescendant remains on the DOM-focused supporting owner and references an active element through a relationship permitted by that property. Pointer and touch interaction update the same active target, the active target is scrolled into view, and visual focus remains discernible and distinct from selection.",
    "proof": ["unit", "axe", "e2e", "human"],
    "standards_refs": [
      {
        "authority": "aria-apg",
        "identifier": "keyboard-interface",
        "url": "https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/",
        "normative": false
      },
      {
        "authority": "wai-aria-1.2",
        "identifier": "aria-activedescendant",
        "url": "https://www.w3.org/TR/wai-aria-1.2/#aria-activedescendant",
        "normative": true
      }
    ]
  },
  {
    "id": "semantics.current-state",
    "version": "1.0.0",
    "title": "Current state",
    "kind": "semantic",
    "requirement": "In a related set with a visually indicated current item, expose exactly one current item with aria-current and the token that matches its meaning: page, step, location, date, time, or true. Omit aria-current or set it to false on every other item, update it with the rendered current item, and do not substitute current state for selected, checked, or pressed state.",
    "proof": ["unit", "axe", "e2e", "human"],
    "standards_refs": [
      {
        "authority": "aria-apg",
        "identifier": "breadcrumb",
        "url": "https://www.w3.org/WAI/ARIA/apg/patterns/breadcrumb/",
        "normative": false
      },
      {
        "authority": "wai-aria-1.2",
        "identifier": "aria-current",
        "url": "https://www.w3.org/TR/wai-aria-1.2/#aria-current",
        "normative": true
      }
    ]
  },
  {
    "id": "semantics.disabled-readonly",
    "version": "1.0.0",
    "title": "Disabled and read-only states",
    "kind": "semantic",
    "requirement": "Use host-language disabled and read-only features when they match the control. A disabled control is perceivable but inoperable: aria-disabled alone does not suppress behavior, so prevent activation through keyboard, pointer, touch, and script, apply it only to the intended scope, and follow the declared discoverability and focus policy. A read-only control remains operable for navigation, focus, selection, and copying as its role permits but does not allow user-initiated value changes; expose aria-readonly only on supporting roles and never interchange the two states.",
    "proof": ["unit", "axe", "e2e", "human"],
    "standards_refs": [
      {
        "authority": "aria-apg",
        "identifier": "keyboard-interface",
        "url": "https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/",
        "normative": false
      },
      {
        "authority": "wai-aria-1.2",
        "identifier": "aria-disabled",
        "url": "https://www.w3.org/TR/wai-aria-1.2/#aria-disabled",
        "normative": true
      },
      {
        "authority": "wai-aria-1.2",
        "identifier": "aria-readonly",
        "url": "https://www.w3.org/TR/wai-aria-1.2/#aria-readonly",
        "normative": true
      },
      {
        "authority": "wcag-2.2",
        "identifier": "4.1.2",
        "url": "https://www.w3.org/TR/WCAG22/#name-role-value",
        "normative": true,
        "level": "A"
      },
