        "level": "A"
      }
    ]
  },
  {
    "id": "semantics.hidden-inert",
    "version": "1.0.0",
    "title": "Hidden and inert content",
    "kind": "semantic",
    "requirement": "Use aria-hidden only when removing rendered content from the accessibility tree is deliberate and equivalent meaning and functionality remain exposed; otherwise let rendering determine exposure. Never set aria-hidden to true on body, a focusable element, an ancestor that still contains focusable descendants or current focus, or content marked hidden=until-found. Do not redundantly add aria-hidden to ordinary hidden content, and do not use aria-hidden alone to make content inoperable. A descendant's aria-hidden=false cannot override aria-hidden=true on an ancestor, so restore exposure through the complete hidden ancestor chain. Before hiding or making an interactive subtree inert, move focus to a logical visible target if that subtree contains current focus; keep critical content outside the inert subtree, visually obscure inactive content, suppress keyboard, pointer, touch, selection, editing, find-in-page, and accessibility-tree interaction together, then restore exposure, operability, and focus order together.",
    "proof": ["unit", "axe", "e2e", "human"],
    "standards_refs": [
      {
        "authority": "aria-apg",
        "identifier": "keyboard-interface",
        "url": "https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/",
        "normative": false
      },
      {
        "authority": "aria-in-html",
        "identifier": "author-conformance",
        "url": "https://www.w3.org/TR/html-aria/",
        "normative": true
      },
      {
        "authority": "html",
        "identifier": "inert",
        "url": "https://html.spec.whatwg.org/multipage/interaction.html#the-inert-attribute",
        "normative": true
      },
      {
        "authority": "wai-aria-1.2",
        "identifier": "aria-hidden",
        "url": "https://www.w3.org/TR/wai-aria-1.2/#aria-hidden",
        "normative": true
      }
    ]
  },
  {
    "id": "semantics.pressed-state",
    "version": "1.0.0",
    "title": "Pressed state",
    "kind": "semantic",
    "requirement": "Use aria-pressed only on a toggle button; omit it from ordinary command buttons and use checked, selected, or current state when those semantics match instead. Expose false or true, and mixed only when a genuine tri-state aggregate exists. Keep the accessible name stable when only pressed state changes, complete a full press-and-release activation cycle exactly once per user action, and synchronize the programmatic state with the visible state before notification.",
    "proof": ["unit", "axe", "e2e", "human"],
    "standards_refs": [
      {
        "authority": "aria-apg",
        "identifier": "button",
        "url": "https://www.w3.org/WAI/ARIA/apg/patterns/button/",
        "normative": false
      },
