[
  {
    "id": "semantics.accessible-description",
    "version": "1.0.0",
    "title": "Accessible description",
    "kind": "semantic",
    "requirement": "When supplementary information is necessary to understand or operate an element, provide it separately from the accessible name. For a concise text description, prefer visible text and reference it with aria-describedby in a meaningful order. Use aria-details instead when the detail is structured or too extensive to flatten, and point it to content available to all users. Every referenced ID resolves to the intended content, descriptions do not duplicate the name or include unrelated prose, and dynamic changes preserve the correct relationship.",
    "proof": ["unit", "axe", "e2e", "human"],
    "standards_refs": [
      {
        "authority": "aria-apg",
        "identifier": "names-and-descriptions",
        "url": "https://www.w3.org/WAI/ARIA/apg/practices/names-and-descriptions/",
        "normative": false
      },
      {
        "authority": "wai-aria-1.2",
        "identifier": "aria-describedby",
        "url": "https://www.w3.org/TR/wai-aria-1.2/#aria-describedby",
        "normative": true
      },
      {
        "authority": "wai-aria-1.2",
        "identifier": "aria-details",
        "url": "https://www.w3.org/TR/wai-aria-1.2/#aria-details",
        "normative": true
      }
    ]
  },
  {
    "id": "semantics.busy-state",
    "version": "1.0.0",
    "title": "Busy state",
    "kind": "semantic",
    "requirement": "Before a rendered region or widget enters a multi-step update that would otherwise expose an inconsistent subtree, set aria-busy to true on the smallest owning container. Keep it true until all required owned elements and user-relevant changes are complete, then remove it or set it to false. Do not use busy state as a substitute for a progress or status message or for disabled state, and never leave a failed or cancelled update permanently busy.",
    "proof": ["unit", "e2e", "human"],
    "standards_refs": [
      {
        "authority": "wai-aria-1.2",
        "identifier": "aria-busy",
        "url": "https://www.w3.org/TR/wai-aria-1.2/#aria-busy",
        "normative": true
      }
    ]
  },
  {
    "id": "semantics.collection-metadata",
    "version": "1.0.0",
    "title": "Collection metadata",
    "kind": "semantic",
    "requirement": "When the DOM cannot convey the complete metadata of a logical collection, table, grid, or treegrid, expose each applicable total size and each rendered item's one-based logical position or hierarchical level using only properties supported by its role; table row totals include header rows. Represent cell spans with native rowspan and colspan in an HTML table and with valid, non-overlapping aria-rowspan and aria-colspan values only for non-native cells. Counts, positions, levels, and spans remain internally consistent; -1 represents only a genuinely unknown total, and metadata is updated after filtering, insertion, removal, reordering, pagination, or virtualization. Omit authored metadata the user agent can calculate from the complete DOM.",
    "proof": ["unit", "axe", "e2e", "human"],
    "standards_refs": [
      {
        "authority": "aria-apg",
