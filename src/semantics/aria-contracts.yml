  {
    "id": "semantics.sort-state",
    "version": "1.0.0",
    "title": "Sort state",
    "kind": "semantic",
    "requirement": "When a table or grid is sorted, expose aria-sort on only the row or column header that represents the active sort key, use the value that matches the rendered order, and remove it from every other header and from all headers when no sort is applied. Make the sorting interaction discoverable through concise control names and, when useful, one shared table instruction without repeating the current state in every control name. For multi-key sorting, communicate the complete sort precedence separately instead of implying unsupported precedence with aria-sort on multiple headers.",
    "proof": ["unit", "axe", "e2e", "human"],
    "standards_refs": [
      {
        "authority": "aria-apg",
        "identifier": "grid-and-table-properties",
        "url": "https://www.w3.org/WAI/ARIA/apg/practices/grid-and-table-properties/",
        "normative": false
