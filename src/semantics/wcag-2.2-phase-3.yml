[
  {"id":"semantics.audio-control","version":"1.0.0","title":"Audio control","kind":"semantic","requirement":"When audio on a web page plays automatically for more than three seconds, provide a mechanism to pause or stop the audio, or provide a mechanism to control its volume independently from the overall system volume level.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.4.2","url":"https://www.w3.org/TR/WCAG22/#audio-control","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"1.4.2","url":"https://www.w3.org/WAI/WCAG22/Understanding/audio-control.html","normative":false,"level":"A"}]},
  {"id":"semantics.flash-threshold","version":"1.0.0","title":"Three flashes or below threshold","kind":"semantic","requirement":"The web page contains nothing that flashes more than three times in any one-second period unless the flash remains below both the general flash threshold and the red flash threshold. Apply this safeguard to all page content because a failure can interfere with use of the entire page.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.3.1","url":"https://www.w3.org/TR/WCAG22/#three-flashes-or-below-threshold","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"2.3.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/three-flashes-or-below-threshold.html","normative":false,"level":"A"}]},
  {"id":"semantics.headings-labels-purpose","version":"1.0.0","title":"Descriptive headings and labels","kind":"semantic","requirement":"Headings and labels describe the topic or purpose of the content or control they identify.","proof":["human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.4.6","url":"https://www.w3.org/TR/WCAG22/#headings-and-labels","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"2.4.6","url":"https://www.w3.org/WAI/WCAG22/Understanding/headings-and-labels.html","normative":false,"level":"AA"}]},
  {"id":"semantics.images-of-text","version":"1.0.0","title":"Images of text","kind":"semantic","requirement":"When the technologies in use can achieve the intended visual presentation, use text rather than images of text to convey information unless the image of text can be visually customized to the user's requirements or the particular presentation of the text is essential to the information being conveyed. Logotypes are considered essential.","proof":["human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.4.5","url":"https://www.w3.org/TR/WCAG22/#images-of-text","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"1.4.5","url":"https://www.w3.org/WAI/WCAG22/Understanding/images-of-text.html","normative":false,"level":"AA"}]},
  {"id":"semantics.info-relationships","version":"1.0.0","title":"Information and relationships","kind":"semantic","requirement":"Information, structure, and relationships conveyed through presentation can be programmatically determined or are available in text.","proof":["axe","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.3.1","url":"https://www.w3.org/TR/WCAG22/#info-and-relationships","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"1.3.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html","normative":false,"level":"A"}]},
  {"id":"semantics.input-labels-instructions","version":"1.0.0","title":"Input labels or instructions","kind":"semantic","requirement":"Provide labels or instructions whenever content requires user input, including the data format, expected value, or task-specific direction needed to complete the input correctly.","proof":["axe","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"3.3.2","url":"https://www.w3.org/TR/WCAG22/#labels-or-instructions","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"3.3.2","url":"https://www.w3.org/WAI/WCAG22/Understanding/labels-or-instructions.html","normative":false,"level":"A"}]},
  {"id":"semantics.input-purpose","version":"1.0.0","title":"Identify input purpose","kind":"semantic","requirement":"For each input field that collects information about the user, make the input purpose programmatically determinable when the field serves a purpose identified in the WCAG Input Purposes for User Interface Components section and the technology supports identifying the expected meaning of form input data.","proof":["axe","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.3.5","url":"https://www.w3.org/TR/WCAG22/#identify-input-purpose","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"1.3.5","url":"https://www.w3.org/WAI/WCAG22/Understanding/identify-input-purpose.html","normative":false,"level":"AA"}]},
  {"id":"semantics.meaningful-sequence","version":"1.0.0","title":"Meaningful sequence","kind":"semantic","requirement":"When the sequence in which content is presented affects its meaning, a correct reading sequence can be programmatically determined.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.3.2","url":"https://www.w3.org/TR/WCAG22/#meaningful-sequence","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"1.3.2","url":"https://www.w3.org/WAI/WCAG22/Understanding/meaningful-sequence.html","normative":false,"level":"A"}]},
  {"id":"semantics.media.audio-description-or-alternative-prerecorded","version":"1.0.0","title":"Prerecorded audio description or media alternative","kind":"semantic","requirement":"For prerecorded video content in synchronized media, provide either an alternative for time-based media or audio description unless the synchronized media is a media alternative for text and is clearly labeled as such.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.2.3","url":"https://www.w3.org/TR/WCAG22/#audio-description-or-media-alternative-prerecorded","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"1.2.3","url":"https://www.w3.org/WAI/WCAG22/Understanding/audio-description-or-media-alternative-prerecorded.html","normative":false,"level":"A"}]},
  {"id":"semantics.media.audio-description-prerecorded","version":"1.0.0","title":"Prerecorded audio description","kind":"semantic","requirement":"Provide audio description for all prerecorded video content in synchronized media.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.2.5","url":"https://www.w3.org/TR/WCAG22/#audio-description-prerecorded","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"1.2.5","url":"https://www.w3.org/WAI/WCAG22/Understanding/audio-description-prerecorded.html","normative":false,"level":"AA"}]},
  {"id":"semantics.media.captions-live","version":"1.0.0","title":"Live captions","kind":"semantic","requirement":"Provide captions for all live audio content in synchronized media.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.2.4","url":"https://www.w3.org/TR/WCAG22/#captions-live","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"1.2.4","url":"https://www.w3.org/WAI/WCAG22/Understanding/captions-live.html","normative":false,"level":"AA"}]},
  {"id":"semantics.media.captions-prerecorded","version":"1.0.0","title":"Prerecorded captions","kind":"semantic","requirement":"Provide captions for all prerecorded audio content in synchronized media unless the synchronized media is a media alternative for text and is clearly labeled as such.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.2.2","url":"https://www.w3.org/TR/WCAG22/#captions-prerecorded","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"1.2.2","url":"https://www.w3.org/WAI/WCAG22/Understanding/captions-prerecorded.html","normative":false,"level":"A"}]},
  {"id":"semantics.media.prerecorded-audio-video-only-alternatives","version":"1.0.0","title":"Prerecorded audio-only and video-only alternatives","kind":"semantic","requirement":"For prerecorded audio-only content, provide an alternative for time-based media that presents equivalent information. For prerecorded video-only content, provide either an alternative for time-based media or an audio track that presents equivalent information. These obligations do not apply when the audio or video is a media alternative for text and is clearly labeled as such.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.2.1","url":"https://www.w3.org/TR/WCAG22/#audio-only-and-video-only-prerecorded","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"1.2.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/audio-only-and-video-only-prerecorded.html","normative":false,"level":"A"}]},
  {"id":"semantics.non-text-content","version":"1.0.0","title":"Complete non-text content alternatives","kind":"semantic","requirement":"All non-text content presented to users has a text alternative that serves the equivalent purpose, with these cases handled explicitly: controls and inputs have names that describe their purpose; time-based media, tests or exercises that would be invalid in text, and content intended to create a specific sensory experience have descriptive identification; CAPTCHA content has text that identifies and describes its purpose plus alternative forms using different sensory output modes; and pure decoration, visual formatting, or content not presented to users is implemented so assistive technology can ignore it.","proof":["axe","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.1.1","url":"https://www.w3.org/TR/WCAG22/#non-text-content","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"1.1.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/non-text-content.html","normative":false,"level":"A"}]},
  {"id":"semantics.orientation","version":"1.0.0","title":"Display orientation","kind":"semantic","requirement":"Do not restrict the view or operation of content to a single display orientation, such as portrait or landscape, unless that specific orientation is essential.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.3.4","url":"https://www.w3.org/TR/WCAG22/#orientation","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"1.3.4","url":"https://www.w3.org/WAI/WCAG22/Understanding/orientation.html","normative":false,"level":"AA"}]},
  {"id":"semantics.resize-text","version":"1.0.0","title":"Resize text","kind":"semantic","requirement":"Except for captions and images of text, text can be resized without assistive technology up to 200 percent without loss of content or functionality.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.4.4","url":"https://www.w3.org/TR/WCAG22/#resize-text","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"1.4.4","url":"https://www.w3.org/WAI/WCAG22/Understanding/resize-text.html","normative":false,"level":"AA"}]},
  {"id":"semantics.sensory-characteristics","version":"1.0.0","title":"Sensory characteristics","kind":"semantic","requirement":"Instructions for understanding and operating content do not rely solely on sensory characteristics of components, including shape, color, size, visual location, orientation, or sound.","proof":["human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.3.3","url":"https://www.w3.org/TR/WCAG22/#sensory-characteristics","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"1.3.3","url":"https://www.w3.org/WAI/WCAG22/Understanding/sensory-characteristics.html","normative":false,"level":"A"}]},
  {"id":"semantics.use-of-color","version":"1.0.0","title":"Use of color","kind":"semantic","requirement":"Color is not the only visual means used to convey information, indicate an action, prompt a response, or distinguish a visual element.","proof":["human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.4.1","url":"https://www.w3.org/TR/WCAG22/#use-of-color","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"1.4.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html","normative":false,"level":"A"}]}
]
