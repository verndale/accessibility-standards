[
  {
    "id": "semantics.native-elements",
    "version": "1.0.0",
    "title": "Native elements",
    "kind": "semantic",
    "requirement": "Use the native HTML element whose semantics, states, and keyboard behavior match the content or control before adding ARIA or building a custom widget. Do not add a redundant role, override strong native semantics with a conflicting role, apply ARIA attributes prohibited for the host element, or name an element whose role prohibits naming. When ARIA is necessary, use only a role and states or properties allowed on that host, implement the interaction behavior ARIA does not provide, and preserve the native element whenever it remains the more robust equivalent.",
    "proof": ["unit", "axe", "human"],
    "standards_refs": [
      {"authority":"aria-apg","identifier":"read-me-first","url":"https://www.w3.org/WAI/ARIA/apg/practices/read-me-first/","normative":false},
      {"authority":"aria-apg","identifier":"structural-roles","url":"https://www.w3.org/WAI/ARIA/apg/practices/structural-roles/","normative":false},
      {"authority":"aria-in-html","identifier":"author-conformance","url":"https://www.w3.org/TR/html-aria/","normative":true},
      {"authority":"wai-aria-1.2","identifier":"host_general_conflict","url":"https://www.w3.org/TR/wai-aria-1.2/#host_general_conflict","normative":true}
    ]
  },
  {
    "id": "semantics.native-dialog",
    "version": "1.0.0",
    "title": "Native dialog semantics",
    "kind": "semantic",
    "requirement": "Use dialog semantics with a programmatic name and modal state only when interaction is modal.",
    "proof": ["axe", "e2e", "human"],
    "standards_refs": [
      {"authority":"aria-apg","identifier":"dialog-modal","url":"https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/","normative":false},
      {"authority":"wai-aria-1.2","identifier":"dialog","url":"https://www.w3.org/TR/wai-aria-1.2/#dialog","normative":true},
      {"authority":"wcag-2.2","identifier":"4.1.2","url":"https://www.w3.org/TR/WCAG22/#name-role-value","normative":true,"level":"A"},
      {"authority":"wcag-2.2-understanding","identifier":"4.1.2","url":"https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html","normative":false,"level":"A"}
    ]
  }
]
