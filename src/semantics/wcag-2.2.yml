[
  {"id":"semantics.accessible-authentication","version":"1.0.0","title":"Accessible authentication","kind":"semantic","requirement":"Do not require a cognitive function test at any authentication step unless that step provides a non-cognitive alternative or an assistive mechanism such as password-manager support or copy and paste, including pasting a complete one-time code, or the test is limited to the object-recognition or user-provided personal-content exception.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"3.3.8","url":"https://www.w3.org/TR/WCAG22/#accessible-authentication-minimum","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"3.3.8","url":"https://www.w3.org/WAI/WCAG22/Understanding/accessible-authentication-minimum.html","normative":false,"level":"AA"}]},
  {"id":"semantics.bypass-blocks","version":"1.0.0","title":"Bypass repeated blocks","kind":"semantic","requirement":"Provide a mechanism to bypass blocks of content that repeat across multiple web pages.","proof":["axe","e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.4.1","url":"https://www.w3.org/TR/WCAG22/#bypass-blocks","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"2.4.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/bypass-blocks.html","normative":false,"level":"A"}]},
  {"id":"semantics.character-key-shortcuts","version":"1.0.0","title":"Character key shortcuts","kind":"semantic","requirement":"When content implements a keyboard shortcut using only letters, punctuation, numbers, or symbols, provide at least one of these safeguards: a mechanism to turn the shortcut off; a mechanism to remap it to include one or more non-printable keys such as Control or Alt; or activation only while the affected user interface component has focus.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.1.4","url":"https://www.w3.org/TR/WCAG22/#character-key-shortcuts","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"2.1.4","url":"https://www.w3.org/WAI/WCAG22/Understanding/character-key-shortcuts.html","normative":false,"level":"A"}]},
  {"id":"semantics.consistent-help","version":"1.0.0","title":"Consistent help","kind":"semantic","requirement":"When human contact details or mechanisms, self-help, or fully automated contact mechanisms repeat across pages in the same set, they occur in the same serialized order relative to other content for the same page variation unless the user initiates a change. This does not require adding help.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"3.2.6","url":"https://www.w3.org/TR/WCAG22/#consistent-help","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"3.2.6","url":"https://www.w3.org/WAI/WCAG22/Understanding/consistent-help.html","normative":false,"level":"A"}]},
  {"id":"semantics.consistent-identification","version":"1.0.0","title":"Consistent identification","kind":"semantic","requirement":"Identify components that provide the same functionality consistently throughout a set of web pages.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"3.2.4","url":"https://www.w3.org/TR/WCAG22/#consistent-identification","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"3.2.4","url":"https://www.w3.org/WAI/WCAG22/Understanding/consistent-identification.html","normative":false,"level":"AA"}]},
  {"id":"semantics.consistent-navigation","version":"1.0.0","title":"Consistent navigation","kind":"semantic","requirement":"Navigational mechanisms repeated across multiple web pages in the same set occur in the same relative order whenever repeated, unless the user initiates the change.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"3.2.3","url":"https://www.w3.org/TR/WCAG22/#consistent-navigation","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"3.2.3","url":"https://www.w3.org/WAI/WCAG22/Understanding/consistent-navigation.html","normative":false,"level":"AA"}]},
  {"id":"semantics.content-on-hover-or-focus","version":"1.0.0","title":"Content on hover or focus","kind":"semantic","requirement":"When pointer hover or keyboard focus makes additional content visible and removing hover or focus hides it, the content can be dismissed without moving hover or focus unless it communicates an input error or does not obscure or replace other content; pointer-triggered content remains visible when the pointer moves over it; and the content persists until the trigger is removed, the user dismisses it, or the information becomes invalid. This does not apply when the visual presentation is controlled by the user agent and is not modified by the author.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.4.13","url":"https://www.w3.org/TR/WCAG22/#content-on-hover-or-focus","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"1.4.13","url":"https://www.w3.org/WAI/WCAG22/Understanding/content-on-hover-or-focus.html","normative":false,"level":"AA"}]},
  {"id":"semantics.context-change.focus","version":"1.0.0","title":"No context change on focus","kind":"semantic","requirement":"A user interface component receiving focus does not initiate a change of context.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"3.2.1","url":"https://www.w3.org/TR/WCAG22/#on-focus","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"3.2.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/on-focus.html","normative":false,"level":"A"}]},
  {"id":"semantics.context-change.input","version":"1.0.0","title":"Predictable context change on input","kind":"semantic","requirement":"Changing the setting of a user interface component does not automatically cause a change of context unless the user was advised of that behavior before using the component.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"3.2.2","url":"https://www.w3.org/TR/WCAG22/#on-input","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"3.2.2","url":"https://www.w3.org/WAI/WCAG22/Understanding/on-input.html","normative":false,"level":"A"}]},
  {"id":"semantics.contrast-minimum","version":"1.0.0","title":"Minimum text contrast","kind":"semantic","requirement":"Text and images of text have a contrast ratio of at least 4.5:1, while large-scale text and images of large-scale text have a contrast ratio of at least 3:1. No minimum applies to text or images of text that are part of an inactive user interface component, are pure decoration, are invisible to everyone, are part of a picture containing significant other visual content, or are part of a logo or brand name.","proof":["axe","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.4.3","url":"https://www.w3.org/TR/WCAG22/#contrast-minimum","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"1.4.3","url":"https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html","normative":false,"level":"AA"}]},
  {"id":"semantics.dragging-alternative","version":"1.0.0","title":"Dragging alternative","kind":"semantic","requirement":"Author-provided functionality operated by dragging also provides an equivalent single-pointer method that does not require dragging, unless dragging is essential or the functionality is determined by the user agent and not modified by the author.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.5.7","url":"https://www.w3.org/TR/WCAG22/#dragging-movements","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"2.5.7","url":"https://www.w3.org/WAI/WCAG22/Understanding/dragging-movements.html","normative":false,"level":"AA"}]},
  {"id":"semantics.focus-order","version":"1.0.0","title":"Focus order","kind":"semantic","requirement":"When a web page can be navigated sequentially and the navigation sequence affects meaning or operation, focusable components receive focus in an order that preserves meaning and operability.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.4.3","url":"https://www.w3.org/TR/WCAG22/#focus-order","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"2.4.3","url":"https://www.w3.org/WAI/WCAG22/Understanding/focus-order.html","normative":false,"level":"A"}]},
  {"id":"semantics.language.page","version":"1.0.0","title":"Page language","kind":"semantic","requirement":"The default human language of each web page can be programmatically determined.","proof":["axe","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"3.1.1","url":"https://www.w3.org/TR/WCAG22/#language-of-page","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"3.1.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/language-of-page.html","normative":false,"level":"A"}]},
  {"id":"semantics.language.parts","version":"1.0.0","title":"Language of parts","kind":"semantic","requirement":"The human language of each passage or phrase can be programmatically determined, except for proper names, technical terms, words of indeterminate language, and words or phrases that have become part of the vernacular of the immediately surrounding text.","proof":["axe","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"3.1.2","url":"https://www.w3.org/TR/WCAG22/#language-of-parts","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"3.1.2","url":"https://www.w3.org/WAI/WCAG22/Understanding/language-of-parts.html","normative":false,"level":"AA"}]},
  {"id":"semantics.link-purpose","version":"1.0.0","title":"Link purpose in context","kind":"semantic","requirement":"The purpose of each link can be determined from its link text alone or from its link text together with programmatically determined link context, except when the purpose would be ambiguous to users in general.","proof":["axe","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.4.4","url":"https://www.w3.org/TR/WCAG22/#link-purpose-in-context","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"2.4.4","url":"https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context.html","normative":false,"level":"A"}]},
  {"id":"semantics.motion-actuation","version":"1.0.0","title":"Motion actuation","kind":"semantic","requirement":"Functionality operable through device motion or user motion is also operable through user interface components, and motion response can be disabled to prevent accidental actuation. These alternatives are not required when motion operates functionality through an accessibility-supported interface or when motion is essential and replacing it would invalidate the activity.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.5.4","url":"https://www.w3.org/TR/WCAG22/#motion-actuation","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"2.5.4","url":"https://www.w3.org/WAI/WCAG22/Understanding/motion-actuation.html","normative":false,"level":"A"}]},
  {"id":"semantics.multiple-ways","version":"1.0.0","title":"Multiple ways to locate pages","kind":"semantic","requirement":"Provide more than one way to locate a web page within a set of web pages, except when the page is the result of, or a step in, a process.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.4.5","url":"https://www.w3.org/TR/WCAG22/#multiple-ways","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"2.4.5","url":"https://www.w3.org/WAI/WCAG22/Understanding/multiple-ways.html","normative":false,"level":"AA"}]},
  {"id":"semantics.non-text-contrast","version":"1.0.0","title":"Non-text contrast","kind":"semantic","requirement":"Visual information required to identify user interface components and their states, and parts of graphics required to understand content, have a contrast ratio of at least 3:1 against adjacent colors. The component requirement excludes inactive components and appearances determined by an unmodified user agent; the graphical-object requirement excludes presentations that are essential to the information conveyed.","proof":["axe","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.4.11","url":"https://www.w3.org/TR/WCAG22/#non-text-contrast","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"1.4.11","url":"https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html","normative":false,"level":"AA"}]},
  {"id":"semantics.page-title","version":"1.0.0","title":"Descriptive page title","kind":"semantic","requirement":"Each web page has a title that describes its topic or purpose.","proof":["axe","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.4.2","url":"https://www.w3.org/TR/WCAG22/#page-titled","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"2.4.2","url":"https://www.w3.org/WAI/WCAG22/Understanding/page-titled.html","normative":false,"level":"A"}]},
  {"id":"semantics.pointer-cancellation","version":"1.0.0","title":"Pointer cancellation","kind":"semantic","requirement":"For functionality operable with a single pointer, satisfy at least one of these conditions: do not execute any part of the function on the down-event; complete on the up-event and provide a way to abort before completion or undo afterward; use the up-event to reverse the outcome of the preceding down-event; or execute on the down-event only when doing so is essential. Functions emulating a keyboard or numeric keypad key press are considered essential. This applies to pointer actions interpreted by web content, not actions required to operate the user agent or assistive technology.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.5.2","url":"https://www.w3.org/TR/WCAG22/#pointer-cancellation","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"2.5.2","url":"https://www.w3.org/WAI/WCAG22/Understanding/pointer-cancellation.html","normative":false,"level":"A"}]},
  {"id":"semantics.pointer-gestures","version":"1.0.0","title":"Pointer gesture alternatives","kind":"semantic","requirement":"All functionality that uses a multipoint or path-based gesture can be operated with a single pointer without a path-based gesture unless the multipoint or path-based gesture is essential. This applies to pointer actions interpreted by web content, not actions required to operate the user agent or assistive technology.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.5.1","url":"https://www.w3.org/TR/WCAG22/#pointer-gestures","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"2.5.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/pointer-gestures.html","normative":false,"level":"A"}]},
  {"id":"semantics.redundant-entry","version":"1.0.0","title":"Redundant entry","kind":"semantic","requirement":"Information previously entered by or provided to the user and required again in the same process is auto-populated or available to select, unless re-entry is essential, required for security, or the prior information is no longer valid.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"3.3.7","url":"https://www.w3.org/TR/WCAG22/#redundant-entry","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"3.3.7","url":"https://www.w3.org/WAI/WCAG22/Understanding/redundant-entry.html","normative":false,"level":"A"}]},
  {"id":"semantics.reflow","version":"1.0.0","title":"Responsive reflow","kind":"semantic","requirement":"Content can be presented without loss of information or functionality and without two-dimensional scrolling when vertically scrolling content is constrained to a width equivalent to 320 CSS pixels or horizontally scrolling content is constrained to a height equivalent to 256 CSS pixels. Parts of content that require a two-dimensional layout for usage or meaning are excepted.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.4.10","url":"https://www.w3.org/TR/WCAG22/#reflow","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"1.4.10","url":"https://www.w3.org/WAI/WCAG22/Understanding/reflow.html","normative":false,"level":"AA"}]},
  {"id":"semantics.text-spacing","version":"1.0.0","title":"Text spacing resilience","kind":"semantic","requirement":"In markup-language content supporting the relevant text style properties, no content or functionality is lost when only these user overrides are applied together: line height of at least 1.5 times the font size, spacing after paragraphs of at least 2 times the font size, letter spacing of at least 0.12 times the font size, and word spacing of at least 0.16 times the font size. A language or script that does not use one or more of these properties need support only the properties that exist for that language and script combination.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"1.4.12","url":"https://www.w3.org/TR/WCAG22/#text-spacing","normative":true,"level":"AA"},{"authority":"wcag-2.2-understanding","identifier":"1.4.12","url":"https://www.w3.org/WAI/WCAG22/Understanding/text-spacing.html","normative":false,"level":"AA"}]},
  {"id":"semantics.timing-adjustable","version":"1.0.0","title":"Adjustable time limits","kind":"semantic","requirement":"For each time limit set by content, at least one condition is met: the user can turn it off before encountering it; the user can adjust it beforehand over a range at least ten times the default duration; the user is warned before expiry, receives at least 20 seconds to extend it with a simple action, and can extend it at least ten times; the limit is required by a real-time event with no possible alternative; the limit is essential and extension would invalidate the activity; or the limit exceeds 20 hours.","proof":["e2e","human"],"standards_refs":[{"authority":"wcag-2.2","identifier":"2.2.1","url":"https://www.w3.org/TR/WCAG22/#timing-adjustable","normative":true,"level":"A"},{"authority":"wcag-2.2-understanding","identifier":"2.2.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/timing-adjustable.html","normative":false,"level":"A"}]}
]
