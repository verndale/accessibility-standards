[
  {
    "id": "semantics.data-table",
    "version": "1.0.0",
    "title": "Data table",
    "kind": "semantic",
    "requirement": "Represent static two-dimensional data with a native table, a descriptive caption when the table needs identification, and th cells associated to data by their row or column scope; use headers and id only for relationships that scope cannot express. Preserve logical reading order and native rowspan and colspan relationships. Use an ARIA table only when native table markup is unavailable, give it an accessible name by referencing a visible label with aria-labelledby or using aria-label when no visible label exists, associate any caption or description with aria-describedby, supply its complete row, cell, and header ownership, and add row or column count, index, span, and sort metadata only when the DOM or native markup cannot communicate them. Use grid or treegrid—not table—only when the cells participate in a composite keyboard interaction model.",
    "proof": ["unit", "axe", "e2e", "human"],
    "standards_refs": [
      {"authority":"aria-apg","identifier":"grid-and-table-properties","url":"https://www.w3.org/WAI/ARIA/apg/practices/grid-and-table-properties/","normative":false},
      {"authority":"aria-apg","identifier":"table","url":"https://www.w3.org/WAI/ARIA/apg/patterns/table/","normative":false},
      {"authority":"wcag-2.2","identifier":"1.3.1","url":"https://www.w3.org/TR/WCAG22/#info-and-relationships","normative":true,"level":"A"},
      {"authority":"wcag-2.2-understanding","identifier":"1.3.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html","normative":false,"level":"A"}
    ]
  }
]
