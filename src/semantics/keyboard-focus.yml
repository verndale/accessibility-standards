[
  {
    "id": "semantics.keyboard",
    "version": "1.0.0",
    "title": "Keyboard operation",
    "kind": "semantic",
    "requirement": "Make all functionality operable from a keyboard without a trap. Use Tab and Shift+Tab to move among page-level controls and the conventional role-specific keys inside composite widgets; do not create extra tab stops for every composite descendant. Keep DOM, reading, and sequential focus order aligned and logical, and never use a positive tabindex value to repair visual order. Keyboard shortcuts supplement rather than replace ordinary navigable access: keep every shortcut target keyboard-focusable, expose its assignment at that target, preserve browser and assistive-technology shortcuts, and prevent default behavior only for keys the active widget owns. Provide a documented keyboard method to leave every focus context.",
    "proof": ["unit", "e2e", "human"],
    "standards_refs": [
      {"authority":"aria-apg","identifier":"keyboard-interface","url":"https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/","normative":false},
      {"authority":"wcag-2.2","identifier":"2.1.1","url":"https://www.w3.org/TR/WCAG22/#keyboard","normative":true,"level":"A"},
      {"authority":"wcag-2.2","identifier":"2.1.2","url":"https://www.w3.org/TR/WCAG22/#no-keyboard-trap","normative":true,"level":"A"},
      {"authority":"wcag-2.2-understanding","identifier":"2.1.1","url":"https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html","normative":false,"level":"A"},
      {"authority":"wcag-2.2-understanding","identifier":"2.1.2","url":"https://www.w3.org/WAI/WCAG22/Understanding/no-keyboard-trap.html","normative":false,"level":"A"}
    ]
  },
  {
