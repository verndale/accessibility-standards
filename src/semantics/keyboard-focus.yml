  {
    "id": "semantics.focus.visible",
    "version": "1.0.0",
    "title": "Visible focus",
    "kind": "semantic",
    "requirement": "Provide a persistent, discernible indicator for the element or active descendant that has keyboard focus, visually distinguish focus from selection, and ensure the focused component is not entirely hidden by author-created content. Prefer the user agent focus indicator; if it is replaced, verify the authored indicator remains visible in forced-colors and other high-contrast modes instead of relying only on colors or gradients that can disappear. When script moves focus or managed focus changes, update the indicator and scroll the active target into view without causing an unexpected context change.",
    "proof": ["e2e", "human"],
    "standards_refs": [
      {"authority":"aria-apg","identifier":"keyboard-interface","url":"https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/","normative":false},
      {"authority":"wcag-2.2","identifier":"2.4.11","url":"https://www.w3.org/TR/WCAG22/#focus-not-obscured-minimum","normative":true,"level":"AA"},
      {"authority":"wcag-2.2","identifier":"2.4.7","url":"https://www.w3.org/TR/WCAG22/#focus-visible","normative":true,"level":"AA"},
      {"authority":"wcag-2.2-understanding","identifier":"2.4.11","url":"https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum.html","normative":false,"level":"AA"},
      {"authority":"wcag-2.2-understanding","identifier":"2.4.7","url":"https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html","normative":false,"level":"AA"}
    ]
  },
