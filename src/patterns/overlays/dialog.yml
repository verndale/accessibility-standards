{"id":"pattern.dialog","version":"1.0.0","title":"Dialog","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"dialog-modal","url":"https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/","normative":false}],"requires":["semantics.accessible-description","semantics.accessible-name","semantics.focus.initial","semantics.focus-order","semantics.focus.return","semantics.focus.visible","semantics.hidden-inert","semantics.keyboard","semantics.keyboard.escape","semantics.name-role-value","semantics.native-dialog","semantics.native-elements","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.dialog"}},"scope":"Named modal dialogs and explicitly non-modal dialog surfaces; excludes urgent response workflows that require alert-dialog semantics","behavior":["Use the native dialog element and its modal or non-modal opening method when it supplies the required lifecycle; otherwise expose one named dialog container and keep its role, name, optional description, and rendered modality synchronized","When the dialog is modal, make content outside it inert for every user before exposing modal state, move focus inside, and keep Tab and Shift plus Tab cycling through the dialog's enabled focusable elements until it closes","When the dialog is non-modal, omit modal state, leave background content operable and in its normal focus order, do not trap focus, and provide a named keyboard-operable way to return to or close the dialog","Choose initial focus from the dialog's purpose and content: focus a safe primary control for a short task, a non-destructive action when reversal is difficult, or a programmatically focusable static heading or paragraph when structural reading should precede controls","Escape closes only the topmost dismissible dialog and never activates its trigger or primary action; when Escape dismissal is disabled, expose another obvious keyboard-operable close action and document the constraint","On close, return focus to the invoking control unless it no longer exists or the workflow defines a more logical successor; never return focus to hidden, inert, disabled, or removed content","For nested dialogs, only the topmost modal layer is interactive, each layer retains its own invoker and return target, and closing a child restores the parent's modal and focus state without exposing the page behind it","Do not use dialog semantics for a tooltip, ordinary disclosure, or non-modal popover that does not need dialog reading and focus behavior, and use alert dialog when an urgent message requires a response"],"product_decisions":["description_strategy","dismissal","initial_focus","modal","outside_interaction","return_focus","stacking"],"functional_spec_bindings":["structure","behavior","states","focus","keyboard","lifecycle"],"implementation_outcomes":["dialog-focus-lifecycle","dialog-modal-inertness","dialog-nonmodal-focus-model","dialog-semantics","dialog-stacking-lifecycle"],"evidence_routes":["unit","axe","e2e","human"]}
