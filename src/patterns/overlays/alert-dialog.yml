{"id":"pattern.alert-dialog","version":"1.0.0","title":"Alert dialog","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"alertdialog","url":"https://www.w3.org/WAI/ARIA/apg/patterns/alertdialog/","normative":false}],"requires":["semantics.accessible-name","semantics.focus.initial","semantics.focus-order","semantics.focus.return","semantics.focus.visible","semantics.keyboard","semantics.keyboard.escape","semantics.name-role-value","semantics.native-dialog","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.alert-dialog"}},"scope":"Modal workflow interruptions that communicate an important message and require a user response; excludes passive alerts and general-purpose dialogs","behavior":["Expose alertdialog semantics with aria-modal true, an accessible name, and an accessible description that references the alert message; do not also expose the container as a passive alert or live status","Make content outside the alert dialog inert for every user and visually obscure it before declaring the dialog modal","On open, move focus inside the dialog to the declared initial target; for destructive or difficult-to-reverse actions, prefer the least destructive response, and for message content that needs structural reading, focus a programmatically focusable static element at the start of the message","Keep Tab and Shift+Tab within the alert dialog while it is open; Escape invokes the declared cancel or dismissal response without activating the primary action","On close, return focus to the invoking control or to a documented logical successor when the invoker no longer exists"],"product_decisions":["dismissal","initial_focus","message_description","response_set"],"functional_spec_bindings":["behavior","states","focus","keyboard","messaging"],"implementation_outcomes":["alert-dialog-focus-lifecycle","alert-dialog-message-association","alert-dialog-modal-semantics"],"evidence_route