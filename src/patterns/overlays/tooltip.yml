{"id":"pattern.tooltip","version":"1.0.0","title":"Tooltip","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"tooltip","url":"https://www.w3.org/WAI/ARIA/apg/patterns/tooltip/","normative":false}],"requires":["semantics.accessible-description","semantics.accessible-name","semantics.content-on-hover-or-focus","semantics.hidden-inert","semantics.keyboard.escape","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.tooltip"}},"scope":"A non-interactive text description that appears for a separately named trigger on keyboard focus or pointer hover","behavior":["Keep the trigger's accessible name independent of the tooltip and associate the tooltip as its accessible description; tooltip text supplements rather than replaces an otherwise missing control label","Expose the popup with tooltip semantics and a stable referenced identifier, and do not place links, buttons, inputs, or any other interactive content inside it","Show the same tooltip when the trigger receives keyboard focus or pointer hover, after the declared delay, without moving focus and without requiring pointer precision to reach its text","Keep the tooltip visible while focus remains on the trigger or while the pointer is over either the trigger or tooltip; dismiss it with Escape without changing focus and hide it when neither persistence condition remains","When hidden, remove the tooltip from visual and accessibility-tree exposure without leaving a stale description relationship that points to absent or unrelated content","Prevent duplicate native and custom tooltips, repeated announcements, and hover-only information; essential instructions remain persistently visible rather than being available only in a tooltip","Provide a deliberate touch and coarse-pointer alternative because hover is unavailable, and do not convert that alternative into an interactive tooltip; use a popover when the surface needs interaction"],"product_decisions":["delay","description_source","dismissal","persistence","touch_alternative"],"functional_spec_bindings":["content","behavior","descriptions","states","keyboard"],"implementation_outcomes":["tooltip-description","tooltip-description-relationship","tooltip-persistence","tooltip-state-lifecycle","tooltip-trigger-parity"],"evidence_routes":["unit","axe","e2e","human"]}
