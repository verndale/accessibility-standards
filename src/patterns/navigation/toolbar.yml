{"id":"pattern.toolbar","version":"1.0.0","title":"Toolbar","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"toolbar","url":"https://www.w3.org/WAI/ARIA/apg/patterns/toolbar/","normative":false}],"requires":["semantics.accessible-name","semantics.focus.visible","semantics.keyboard","semantics.name-role-value","semantics.native-elements","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.toolbar"}},"scope":"Named groups of three or more related controls that use a managed composite focus model","behavior":["Expose a named toolbar containing controls with their native or pattern-specific roles and states; expose aria-orientation when the toolbar is vertical and treat horizontal as the default","Keep one toolbar control in the page tab sequence; on first entry focus the first enabled control, optionally restore the last-focused control on later entry, and let Tab and Shift+Tab move into or out of the toolbar rather than among its controls","In a horizontal toolbar, Right Arrow moves to the next control and Left Arrow to the previous control; in a vertical toolbar, Down Arrow moves next and Up Arrow moves previous; apply the declared wrapping policy without activating controls","When enabled by the declared home_end decision, Home moves focus to the first control and End moves focus to the last control","Reserve the toolbar navigation arrow pair for moving focus, preserve the orthogonal arrow pair for operating embedded controls, and avoid controls that require the navigation pair or place the single unavoidable control last","Toolbar navigation moves focus without changing a radio selection or activating another control; Space or Enter is delegated to the focused control's own interaction model","Apply the declared disabled_focusability policy consistently, keeping a disabled control focusable only when discoverability is important while always preventing activation"],"pro