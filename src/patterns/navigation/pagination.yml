{"id":"pattern.pagination","version":"1.0.0","title":"Pagination","kind":"pattern","standards_refs":[{"authority":"wcag-2.2","identifier":"2.4.4","url":"https://www.w3.org/TR/WCAG22/#link-purpose-in-context","normative":true,"level":"A"}],"requires":["semantics.accessible-name","semantics.current-state","semantics.disabled-readonly","semantics.focus.visible","semantics.landmarks","semantics.link-purpose","semantics.native-elements","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.pagination"}},"scope":"Navigation among stable pages or result segments with one visually identified current page","behavior":["Wrap the controls in a named navigation landmark that distinguishes pagination from other navigation regions on the page","Use real links with valid destinations when each page has a URL, preserve expected browser navigation behavior, and ensure every numbered, previous, and next link has a purpose that is clear in context","Expose exactly one rendered item as the current page with current-page state; do not use selected, pressed, or disabled state as a substitute for current state","Keep the current-page item either an operable self-link or non-interactive text according to the declared model, and do not add it to the Tab order when it has no action","At the first and last page, omit the unavailable boundary control or render it as genuinely non-interactive content; if a button-driven client-side model is required, synchronize native or ARIA disabled state and suppress all activation paths","Render truncation marks as non-interactive text, preserve logical reading and focus order when the visible page window changes, and expose enough adjacent pages for the current location to remain understandable","After navigation, update the page title, current state, and result content together; for client-side updates, move focus or announce completion according to the declared policy without doing both redundantly or returning focus to a removed control"],"product_decisions":["boundary_controls","current_page_interactive","item_labeling","post_navigation_focus","result_announcement","truncation","url_behavior"],"functional_spec_bindings":["structure","states","navigation","keyboard","focus","messaging"],"implementation_outcomes":["pagination-boundary-state","pagination-current-page","pagination-focus-lifecycle","pagination-link-semantics","pagination-navigation-landmark"],"evidence_routes":["unit","axe","e2e","human"]}
