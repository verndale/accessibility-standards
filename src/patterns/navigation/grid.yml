{
  "id": "pattern.grid",
  "version": "1.0.0",
  "title": "Grid",
  "kind": "pattern",
  "standards_refs": [
    {
      "authority": "aria-apg",
      "identifier": "grid",
      "url": "https://www.w3.org/WAI/ARIA/apg/patterns/grid/",
      "normative": false
    }
  ],
  "requires": [
    "semantics.accessible-description",
    "semantics.accessible-name",
    "semantics.busy-state",
    "semantics.collection-metadata",
    "semantics.composite-focus",
    "semantics.disabled-readonly",
