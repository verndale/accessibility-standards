{"id":"pattern.menu-button","version":"1.0.0","title":"Menu button","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"menu-button","url":"https://www.w3.org/WAI/ARIA/apg/patterns/menu-button/","normative":false}],"requires":["semantics.accessible-description","semantics.accessible-name","semantics.disabled-readonly","semantics.expanded-state","semantics.focus.initial","semantics.focus.return","semantics.focus.visible","semantics.hidden-inert","semantics.keyboard","semantics.keyboard.escape","semantics.native-elements","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.menu-button"}},"scope":"A button that opens a popup command menu; excludes navigation lists, native select controls, and disclosure content that does not use menu semantics","behavior":["Use a native button for the trigger, expose that it opens a menu, synchronize expanded state, and identify the popup relationship when needed; a disabled trigger remains non-activatable through every input modality","Enter or Space opens the menu and moves focus to its first enabled item; Down Arrow may provide the same first-item entry and Up Arrow may open it with focus on the last enabled item when those optional keys are declared","When open, delegate item navigation, type-ahead, disabled-item behavior, submenus, and activation to the complete menu pattern rather than keeping DOM focus on the trigger","Escape closes the topmost menu without activating an item and returns focus to the trigger; item activation, outside interaction, and repeated trigger activation close according to the declared dismissal policy","When closed, remove the popup and its descendants from pointer, keyboard, and accessibility-tree interaction; when reopened, establish the declared entry focus without leaving multiple page-tab stops inside the menu","Keep the trigger's accessible name stable unless changing it is necessary to name a different action, and communicate supplementary instructions as a description rather than embedding state text in the name"],"product_decisions":["disabled_focusability","dismissal","focus_strategy","open_keys","popup_relationship","trigger_label"],"functional_spec_bindings":["structure","behavior","states","keyboard","focus"],"implementation_outcomes":["menu-button-dismissal","menu-button-keyboard","menu-button-keyboard-model","menu-button-popup-relationship","menu-button-state-lifecycle"],"evidence_routes":["unit","axe","e2e","human"]}
