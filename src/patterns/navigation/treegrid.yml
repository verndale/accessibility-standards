{
  "id": "pattern.treegrid",
  "version": "1.0.0",
  "title": "Treegrid",
  "kind": "pattern",
  "standards_refs": [
    {
      "authority": "aria-apg",
      "identifier": "treegrid",
      "url": "https://www.w3.org/WAI/ARIA/apg/patterns/treegrid/",
      "normative": false
    }
  ],
  "requires": [
    "semantics.accessible-description",
    "semantics.accessible-name",
