{"id":"pattern.tabs","version":"1.0.0","title":"Tabs","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"tabs","url":"https://www.w3.org/WAI/ARIA/apg/patterns/tabs/","normative":false}],"requires":["semantics.accessible-name","semantics.composite-focus","semantics.disabled-readonly","semantics.focus.visible","semantics.hidden-inert","semantics.keyboard","semantics.presentational-role","semantics.roles-states-properties","semantics.selected-state"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.tabs"}},"scope":"A tab list whose tabs select one associated tab panel at a time","behavior":["Expose one named tablist containing named tabs, associate every tab with exactly one tabpanel and every tabpanel with its tab, and synchronize selected state with the visibly active panel","Keep one enabled tab in the page Tab sequence; when entering the tablist, focus the selected tab or the declared fallback, and keep DOM focus visually distinct from selection when manual activation is used","For a horizontal tablist, Left and Right Arrow move focus among enabled tabs; for a vertical tablist, Up and Down Arrow do so and the tablist exposes its orientation; apply the declared wrapping policy without scrolling the page on consumed keys","Home and End move focus to the first and last enabled tab when that optional behavior is declared; disabled tabs do not activate and follow the declared discoverability and focusability policy","With automatic activation, moving focus selects the tab only when its panel can render without noticeable delay; with manual activation, arrow keys move focus without selection and Space or Enter activates the focused tab","Tab leaves the tablist and moves into the active panel's first focusable descendant, or to the next page stop when the panel has none; Shift plus Tab follows the document's reverse order rather than navigating among tabs","Expose the active panel and fully hide every inactive panel and its focusable descendants from visual, pointer, keyboard, and accessibility-tree interaction before updating selected state","If tabs can be deleted, Delete removes only the focused tab after confirmation rules are satisfied, selects and focuses a documented adjacent tab, and moves focus to a logical successor when no tabs remain","When tabs or panels are inserted, removed, reordered, or loaded asynchronously, preserve one valid selected tab, one managed tab stop, and resolvable tab-to-panel relationships"],"product_decisions":["automatic_or_manual_activation","deletable_tabs","disabled_focusability","focus_strategy","home_end","initial_selection","orientation","wrap_navigation"],"functional_spec_bindings":["structure","behavior","states","keyboard","focus","lifecycle"],"implementation_outcomes":["tabs-composite-focus","tabs-keyboard-model","tabs-panel-relationships","tabs-selection-lifecycle","tabs-visibility-lifecycle"],"evidence_routes":["unit","axe","e2e","human"]}
