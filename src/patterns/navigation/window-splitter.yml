{"id":"pattern.window-splitter","version":"1.0.0","title":"Window splitter","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"windowsplitter","url":"https://www.w3.org/WAI/ARIA/apg/patterns/windowsplitter/","normative":false}],"requires":["semantics.accessible-name","semantics.disabled-readonly","semantics.dragging-alternative","semantics.focus.visible","semantics.hidden-inert","semantics.keyboard","semantics.name-role-value","semantics.native-elements","semantics.presentational-role","semantics.range-value","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.window-splitter"}},"scope":"Focusable separators that resize or collapse adjacent panes; excludes static visual or menu separators","behavior":["Use a static native separator when no resizing behavior exists; for an adjustable splitter, expose a focusable separator named for the primary pane, set aria-controls to that pane, and expose the splitter's visual orientation without placing meaning-bearing descendants inside the separator","Expose synchronized current, minimum, and maximum values that represent the primary pane's relative size, provide user-friendly value text when the numeric value is insufficient, and keep focus on the splitter while its value changes","For a vertical splitter, Left and Right Arrow move the splitter left and right; for a horizontal splitter, Up and Down Arrow move it up and down; use the declared step and clamp every change to the allowed range","When enabled, Home and End move to the positions that give the primary pane its minimum and maximum size, Enter collapses a visible primary pane and restores its previous position on the next activation, and F6 cycles through panes according to the declared pane-navigation order","For a fixed two-position splitter, omit continuous arrow-key adjustment and expose only the declared collapse and restore interaction; for a variable splitter, make the full keyboard adjustment model equivalent to pointer dragging and provide any additional single-pointer non-drag method required by the product","When a pane is fully collapsed, remove its descendants from sequential focus and expose the same hidden state visually and programmatically; disabled splitters remain non-activatable and follow the declared focusability policy"],"product_decisions":["collapse_behavior","disabled_focusability","f6_pane_cycle","fixed_or_variable","home_end","orientation","pane_navigation_order","primary_pane","range_bounds","step","value_text"],"functional_spec_bindings":["behavior","controls","focus","keyboard","states"],"implementation_outcomes":["window-splitter-collapse-state","window-splitter-keyboard-model","window-splitter-pane-relationship","window-splitter-range-state"],"evidence_routes":["unit","axe","e2e","human"]}
