{"id":"pattern.image","version":"1.0.0","title":"Image","kind":"pattern","standards_refs":[{"authority":"wcag-2.2","identifier":"1.1.1","url":"https://www.w3.org/TR/WCAG22/#non-text-content","normative":true,"level":"A"}],"requires":["semantics.accessible-description","semantics.native-elements","semantics.non-text-alternative"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.image"}},"scope":"Informative, functional, complex, text-bearing, or decorative raster, vector, canvas, or image-map content","behavior":["Classify the image by purpose in its current context before choosing an alternative; filenames, generic image labels, and machine-generated captions are not accepted without content review","For an informative image, provide concise equivalent alternative text; for a functional image, name the action or destination rather than describing its appearance","For a decorative or redundant image, use the native empty-alternative mechanism and ensure it does not add a redundant role, name, focus stop, or announcement","For a complex image, provide a concise identification plus an adjacent or programmatically associated long description that communicates every relationship needed to understand the same purpose","For an image containing essential text, include the same text in the alternative or nearby content and prefer real text whenever the visual presentation does not require an image","For linked images, image maps, SVG, canvas, and generated media, expose one non-duplicative name for each operable target and provide an equivalent text or data representation when pixels alone carry meaning","Do not repeat visible captions verbatim in alternative text unless that repetition is necessary to make the image understandable out of context"],"product_decisions":["caption_relationship","fallback_text","functional_name","long_description","purpose"],"functional_spec_bindings":["content","purpose","labeling","descriptions","fallback"],"implementation_outcomes":["complex-image-description","decorative-image-suppression","functional-image-name","image-alternative","image-purpose-classification","non-raster-image-alternative"],"evidence_routes":["unit","axe","e2e","human"]}
