{"id":"pattern.media-player","version":"1.0.0","title":"Media player","kind":"pattern","standards_refs":[{"authority":"wcag-2.2","identifier":"1.2.1","url":"https://www.w3.org/TR/WCAG22/#audio-only-and-video-only-prerecorded","normative":true,"level":"A"},{"authority":"wcag-2.2","identifier":"1.2.2","url":"https://www.w3.org/TR/WCAG22/#captions-prerecorded","normative":true,"level":"A"},{"authority":"wcag-2.2","identifier":"1.2.3","url":"https://www.w3.org/TR/WCAG22/#audio-description-or-media-alternative-prerecorded","normative":true,"level":"A"},{"authority":"wcag-2.2","identifier":"1.2.5","url":"https://www.w3.org/TR/WCAG22/#audio-description-prerecorded","normative":true,"level":"AA"}],"requires":["semantics.accessible-description","semantics.accessible-name","semantics.audio-control","semantics.busy-state","semantics.character-key-shortcuts","semantics.disabled-readonly","semantics.focus.visible","semantics.keyboard","semantics.live-status","semantics.media-alternatives","semantics.motion-control","semantics.name-role-value","semantics.native-elements","semantics.pressed-state","semantics.range-value","semantics.roles-states-properties"],"activation":{"any":[{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.media-player"}},{"equals":{"fact":"content.has_media","value":true}}]},"scope":"Native or custom controls for audio, video, synchronized media, and their required alternatives","behavior":["Use native audio or video controls when they satisfy the required control set and target-platform behavior; replace them only when the custom player reproduces complete keyboard, focus, name, role, value, and disabled behavior","Give every custom control a persistent visible or programmatic name and synchronized state; use pressed state only for a stable-label toggle, and use an action label such as Play or Pause without pressed state when the label changes to name the next action","Expose playback time, seek position, playback rate, and volume with the appropriate read-only or adjustable semantics and user-friendly value text; preserve arrow, Home, End, and text-entry keys required by the composed range control and do not announce every time update","Provide applicable captions, transcript, audio description, and audio-only or video-only alternatives, identify the available track or language, and keep the chosen alternative synchronized when the source changes","Do not autoplay audible media for more than three seconds without an immediately available pause, stop, or independent volume control; honor reduced-motion behavior and do not start or resume playback solely because focus moved","Scope single-character shortcuts to the focused player or provide a way to disable or remap them, and do not intercept browser, screen-reader, or platform media commands","Keep controls visible while they or their descendants have focus, preserve a logical Tab order, and when entering or leaving full screen retain focus on the equivalent control or move it to a documented logical successor","During buffering or source changes, mark only the inconsistent player region busy, keep transport controls' operability synchronized, and announce a meaningful delay, failure, or readiness change once without live-announcing continuous playback","When media ends, fails, or is replaced, stop stale announcements, expose the final state, and apply the declared replay and post-playback focus behavior without moving focus unexpectedly"],"product_decisions":["audio_description","autoplay","buffering_announcement","captions","control_set","full_screen_focus","keyboard_shortcuts","native_or_custom","post_playback_behavior","toggle_state_model","transcript"],"functional_spec_bindings":["content","alternatives","controls","behavior","states","keyboard","focus","messaging","lifecycle"],"implementation_outcomes":["media-alternatives","media-buffering-lifecycle","media-control-state","media-controls","media-full-screen-focus","media-keyboard-model",