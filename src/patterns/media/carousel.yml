{"id":"pattern.carousel","version":"1.0.0","title":"Carousel","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"carousel","url":"https://www.w3.org/WAI/ARIA/apg/patterns/carousel/","normative":false}],"requires":["semantics.accessible-description","semantics.accessible-name","semantics.collection-metadata","semantics.focus.visible","semantics.hidden-inert","semantics.keyboard","semantics.live-status","semantics.motion-control","semantics.native-elements","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.carousel"}},"scope":"A labeled set of content slides navigated sequentially, with optional automatic rotation","behavior":["Expose the carousel as a named region or group and identify each slide as a distinct named group whose label communicates its content or logical position without repeating the carousel name","Provide native-button previous, next, rotation, and picker controls as applicable; each control has an unambiguous name, visible focus, and the same operation for keyboard, pointer, and touch","Place a stop-rotation control before automatically rotating content in the Tab order, stop rotation when any carousel element receives keyboard focus or the pointer hovers over it, and do not restart unless the user explicitly requests rotation","Changing slides never moves keyboard focus unless the user activated a control whose documented action moves it; keep the control that initiated navigation stable and available after the update","Expose only the active slide when the design presents one slide at a time; make every inactive slide and its descendants unavailable to visual, pointer, keyboard, and accessibility-tree interaction before rotating away from it","When slides are lazy loaded or virtualized, keep logical position and set-size metadata consistent, mark loading separately from selection, and never remove a slide that contains focus","Announce a user-initiated slide change once with a concise status when the new content is not otherwise apparent; suppress live announcements during automatic rotation and avoid repeating position text already in the slide name","If picker controls use tabs, implement the complete tabs pattern; otherwise use ordinary named buttons and do not add tab roles or selected state merely for styling","Apply the declared looping and boundary-control behavior consistently, and never expose an enabled control whose action cannot change the current slide"],"product_decisions":["announcement_policy","auto_rotation","boundary_controls","looping","offscreen_slide_strategy","picker_model","rotation_control","slide_labeling","virtualization"],"functional_spec_bindings":["structure","content","behavior","states","controls","keyboard","focus","messaging"],"implementation_outcomes":["carousel-announcement-policy","carousel-controls","carousel-focus-stability","carousel-rotation","carousel-slide-semantics","carousel-visibility-lifecycle"],"evidence_routes":["unit","axe","e2e","human"]}
