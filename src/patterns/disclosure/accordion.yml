{"id":"pattern.accordion","version":"1.0.0","title":"Accordion","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"accordion","url":"https://www.w3.org/WAI/ARIA/apg/patterns/accordion/","normative":false}],"requires":["semantics.accessible-name","semantics.disabled-readonly","semantics.expanded-state","semantics.focus.visible","semantics.hidden-inert","semantics.keyboard","semantics.native-elements","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.accordion"}},"scope":"Grouped disclosure sections whose heading controls independently show and hide associated content panels","behavior":["Use a native button for each accordion header control and place that button inside a heading whose level preserves the page outline; do not put persistent icons, menus, or other controls inside the heading button","Expose the controlled panel relationship and synchronize the control's expanded state with the panel's rendered visibility; a collapsed panel is hidden from every interaction modality and does not retain focus","Enter or Space toggles only the panel controlled by the focused header without submitting an ancestor form or changing focus","Keep every enabled header in the page Tab sequence; if optional Up, Down, Home, or End navigation is provided, move focus among headers without toggling panels and apply the declared wrapping policy consistently","When the single-open model opens a panel, close only the previously open peer panels; when the product requires one panel to remain open, expose its header as disabled while it cannot be collapsed","Use a region for a panel only when it materially improves navigation, and name that region from its header without creating excessive landmark noise"],"product_decisions":["all_sections_collapsible","heading_level","header_navigation","navigation_wrap","panel_region","single_or_multiple_open"],"functional_spec_bindings":["structure","behavi