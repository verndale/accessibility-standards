{"id":"pattern.combobox","version":"1.0.0","title":"Combobox","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"combobox","url":"https://www.w3.org/WAI/ARIA/apg/patterns/combobox/","normative":false}],"requires":["semantics.accessible-description","semantics.accessible-name","semantics.collection-metadata","semantics.composite-focus","semantics.disabled-readonly","semantics.expanded-state","semantics.focus.visible","semantics.hidden-inert","semantics.keyboard","semantics.live-status","semantics.native-elements","semantics.roles-states-properties","semantics.selected-state"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.combobox"}},"scope":"An editable or select-only combobox controlling a listbox, grid, tree, or dialog popup","behavior":["Use a native select or input with datalist when it satisfies the required editing, option, and popup behavior; otherwise expose one named combobox whose editable or select-only state matches the visible control","Synchronize expanded state, identify the popup relationship, and expose the actual popup type; when closed, make the popup unavailable to visual, pointer, keyboard, and accessibility-tree interaction","For listbox, grid, or tree popups, keep DOM focus on the combobox and expose one valid active descendant, or use the declared APG-compatible focus strategy consistently; when a dialog popup opens, move focus according to the composed dialog pattern","Down Arrow and Up Arrow open or navigate the popup according to the declared model, Enter accepts the active suggestion when one exists, Escape closes without committing and may restore the prior value, and Tab accepts or rejects the pending value according to the declared commit policy before leaving the widget","For an editable combobox, preserve native text entry, selection, deletion, undo, clipboard, Home, End, and platform editing commands; never intercept keys merely because they are also meaningful inside the popup","Expose autocomplete behavior that matches the implementation, keep active option distinct from committed selection, and synchronize the input value, selected option, and visible suggestion after keyboard, pointer, touch, or programmatic changes","Announce the number or availability of filtered results and loading, empty, or failure states only when useful; do not live-announce every active option already exposed through composite focus","Apply disabled and read-only state only to supporting hosts and prevent the operations those states disallow while retaining permitted focus, selection, copying, and popup review behavior","When options are virtualized or partially rendered, keep logical position and set size correct, retain the active option in the accessibility tree, and scroll it into view before updating the active descendant","On blur, form submission, option removal, or asynchronous replacement, resolve free-form text and pending selection according to the declared validation and commit policies without leaving stale expanded, active, or selected state"],"product_decisions":["autocomplete","commit_on_blur","editable","filtering","focus_strategy","opens_on","popup_role","selection_commit","validation","virtualization","wrap_navigation"],"functional_spec_bindings":["structure","behavior","states","keyboard","focus","selection","messaging","lifecycle"],"implementation_outcomes":["combobox-active-descendant","combobox-autocomplete","combobox-keyboard-model","combobox-popup-relationship","combobox-state-machine","combobox-value-commit","combobox-virtualization-metadata"],"evidence_routes":["unit","axe","e2e","human"]}
