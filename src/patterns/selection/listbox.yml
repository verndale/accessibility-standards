{"id":"pattern.listbox","version":"1.0.0","title":"Listbox","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"listbox","url":"https://www.w3.org/WAI/ARIA/apg/patterns/listbox/","normative":false}],"requires":["semantics.accessible-description","semantics.accessible-name","semantics.collection-metadata","semantics.composite-focus","semantics.disabled-readonly","semantics.focus.visible","semantics.keyboard","semantics.native-elements","semantics.presentational-role","semantics.roles-states-properties","semantics.selected-state"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.listbox"}},"scope":"A single-select or multi-select list of non-interactive options with managed composite focus","behavior":["Use a native select when it supplies the required single or multiple selection, sizing, labeling, and keyboard behavior; otherwise expose one named listbox containing only named options and semantically neutral grouping elements","Keep one predictable page-tab stop by using roving tabindex or a valid active descendant, focus the selected option on entry or the first enabled option when none is selected, and scroll the active option into view","In a vertical listbox, Down and Up Arrow move to the next and previous enabled option; in a horizontal listbox, Right and Left Arrow do so and the listbox exposes its orientation; Home and End move to the first and last enabled option when enabled by policy","Implement type-ahead for a list with more than a few options, cycle repeated characters and repeated matches within the declared timeout, and do not intercept keys used by a containing editable control","Keep visual and programmatic focus distinct from selection; in single-select mode apply the declared selection-follows-focus or explicit Space or Enter model without exposing more than one selected option","For multi-select, use one documented model consistently: the recommended modifier-free model preserves selection during navigation and Space toggles the active option, while a modifier-required model preserves and extends selection only with its declared Control and Shift combinations","Disabled options never activate or become selected and follow the declared focusability policy; listbox read-only state permits navigation and review while preventing selection changes","Options do not contain links, buttons, checkboxes, inputs, or other interactive descendants; use a grid, tree, or another composite pattern when each row needs independently operable content","When options are virtualized, filtered, inserted, removed, or reordered, keep logical position and set size synchronized, preserve a valid active option and selection, and never reference an active descendant that is absent from the accessibility tree","Pointer and touch actions update the same active and selected state as keyboard interaction, and blur or form submission commits the value according to the declared selection model without unexpected context changes"],"product_decisions":["disabled_focusability","focus_strategy","home_end","multi_select_keyboard_model","orientation","selection_follows_focus","single_or_multi","typeahead","virtualization","wrap_navigation"],"functional_spec_bindings":["structure","behavior","states","keyboard","focus","selection","lifecycle"],"implementation_outcomes":["listbox-composite-focus","listbox-disabled-state","listbox-keyboard-model","listbox-option-semantics","listbox-selection-model","listbox-virtualization-metadata"],"evidence_routes":["unit","axe","e2e","human"]}
