{"id":"pattern.progress","version":"1.0.0","title":"Progress","kind":"pattern","standards_refs":[{"authority":"wai-aria-1.2","identifier":"progressbar","url":"https://www.w3.org/TR/wai-aria-1.2/#progressbar","normative":true},{"authority":"wcag-2.2","identifier":"4.1.2","url":"https://www.w3.org/TR/WCAG22/#name-role-value","normative":true,"level":"A"}],"requires":["semantics.accessible-name","semantics.busy-state","semantics.live-status","semantics.name-role-value","semantics.native-elements","semantics.presentational-role","semantics.range-value","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.progress"}},"scope":"Read-only determinate or indeterminate progress for an operation, distinct from a user-adjustable slider and from a static meter","behavior":["Use the native progress element when it provides the required presentation and semantics; otherwise expose one named progressbar for the operation","For determinate progress, keep minimum, maximum, and current values valid and synchronized and provide user-friendly value text when the number alone is not meaningful; for indeterminate progress, omit the current value until a value is known","Associate the progress indicator with the operation or region it describes, mark that region busy only while its contents are incomplete, and clear the busy state when the operation settles","Do not make the progressbar focusable or adjustable unless it also implements a separate interactive control pattern","Announce meaningful phase changes, failure, or completion once through a status message; do not place continuously changing numeric values in a live region or announce every increment","When progress completes, preserve the final state long enough to be perceived or replace it with an equivalent completion message according to the declared lifecycle"],"product_decisions":["completion_announcement","controlled_region","determinate","message_lifecycle","range_bounds","value_text"],"functional_spec_bindings":["structure","states","messaging","lifecycle"],"implementation_outcomes":["progress-busy-lifecycle","progress-completion-announcement","progress-native-fallback","progress-value","progress-value-state"],"evidence_routes":["unit","axe","e2e","human"]}
