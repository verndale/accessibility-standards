{"id":"pattern.alert","version":"1.0.0","title":"Alert","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"alert","url":"https://www.w3.org/WAI/ARIA/apg/patterns/alert/","normative":false}],"requires":["semantics.alert","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.alert"}},"scope":"Urgent, time-sensitive, non-interactive information that requires immediate assistive-technology announcement without a user response","behavior":["Reserve alert semantics for urgent information; use a status message for routine progress or confirmation and an alert dialog when the message requires a response","Create or identify the live container before inserting the alert content so the content change is observable, and expose each logical message once without duplicating it through nested or competing live regions","Announce the alert without moving keyboard focus, changing context, or interrupting the user's current input","Keep buttons, links, and other interactive controls outside the alert node; associate any related action separately so the announcement does not imply that focus moved","Remove, replace, or repeat an alert only according to the declared message lifecycle, and do not repeatedly announce unchanged text"],"product_decisions":["announcement_atomicity","message_lifecycle","repeat_policy","urgency"],"functional_spec_bindings":["messaging","states","lifecycle"],"implementation_outcomes":["alert-announcement","alert-live-region-lifecycle","alert-no-focus-transfer","alert-urgency-classification"],"evidence_routes":["unit","axe","e2e","human"]}
