{"id":"pattern.meter","version":"1.0.0","title":"Meter","kind":"pattern","standards_refs":[{"authority":"aria-apg","identifier":"meter","url":"https://www.w3.org/WAI/ARIA/apg/patterns/meter/","normative":false}],"requires":["semantics.accessible-name","semantics.name-role-value","semantics.native-elements","semantics.presentational-role","semantics.range-value","semantics.roles-states-properties"],"activation":{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.meter"}},"scope":"Read-only scalar measurements with a meaningful bounded range; excludes task progress and user-adjustable values","behavior":["Use a native meter element when it supplies the required range, threshold, labeling, and value presentation; otherwise expose a named element with role meter","Expose synchronized current, minimum, and maximum numeric values, keep the current value within the declared range, and provide user-friendly value text when a percentage alone would not communicate the measurement","Keep the meter read-only and out of the page tab sequence; use progressbar for task completion, slider or spinbutton for a user-adjustable value, and ordinary text when the value has no meaningful maximum","Keep visible values, units, qualitative thresholds, and programmatic values consistent, and place any meaning-bearing label, description, or threshold explanation outside a custom meter because descendants of role meter are presentational"],"product_decisions":["host_element","range_bounds","thresholds","value_source","value_text"],"functional_spec_bindings":["content","states"],"implementation_outcomes":["meter-native-element-selection","meter-range-state","meter-value-presentation"],"evidence_routes":["unit","axe","e2e","human"]}
