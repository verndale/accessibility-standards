{"id":"pattern.dynamic-status","version":"1.0.0","title":"Dynamic status","kind":"pattern","standards_refs":[{"authority":"wcag-2.2","identifier":"4.1.3","url":"https://www.w3.org/TR/WCAG22/#status-messages","normative":true,"level":"AA"}],"requires":["semantics.busy-state","semantics.live-status","semantics.roles-states-properties"],"activation":{"equals":{"fact":"component.has_dynamic_status","value":true}},"scope":"Non-urgent asynchronous status, result, loading, or completion information that must be available without receiving focus","behavior":["Create the status container before the asynchronous update, use the least interruptive live-region behavior that communicates the change, and reserve alert semantics for urgent messages","Insert concise user-relevant text into one correctly scoped status region; do not announce visual-only implementation details, unchanged content, or the same message through multiple live containers","Do not move focus or change context when the status appears; keep any related controls in their normal DOM and focus order","For batched or loading updates, mark the affected region busy only while its exposed subtree is inconsistent, then clear the busy state after the final meaningful update so assistive technology receives a stable result","Clear or replace stale status text according to the declared lifecycle without erasing a message before assistive technology can announce it"],"product_decisions":["announcement_atomicity","announcement_copy","announcement_priority","busy_region","message_lifecycle"],"functional_spec_bindings":["messaging","states","lifecycle"],"implementation_outcomes":["status-announcement-policy","status-busy-lifecycle","status-live-region","status-message-lifecycle"],"evidence_routes":["unit","axe","e2e","human"]}
