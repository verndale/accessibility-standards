{"id":"pattern.validation","version":"1.0.0","title":"Form validation","kind":"pattern","standards_refs":[{"authority":"wcag-2.2","identifier":"3.3.1","url":"https://www.w3.org/TR/WCAG22/#error-identification","normative":true,"level":"A"},{"authority":"wcag-2.2","identifier":"3.3.3","url":"https://www.w3.org/TR/WCAG22/#error-suggestion","normative":true,"level":"AA"}],"requires":["semantics.accessible-description","semantics.busy-state","semantics.focus.initial","semantics.focus.visible","semantics.form-error","semantics.live-status","semantics.name-role-value","semantics.roles-states-properties"],"activation":{"any":[{"contains":{"fact":"component.accessibility_pattern_ids","value":"pattern.validation"}},{"equals":{"fact":"component.has_validation","value":true}}]},"scope":"Synchronous or asynchronous form validation with inline errors and an optional form-level error summary","behavior":["Validate at the declared interaction point without interrupting text entry, clearing user input, or reporting an error before the user has had a reasonable opportunity to satisfy the field","When an error is detected, expose invalid state on the control, render a specific text message that identifies the problem and a known correction, and programmatically associate that message with the control without replacing its label","Keep each inline error adjacent to its field and stable across rerenders; clear invalid state and obsolete associations as soon as the error is resolved","After an unsuccessful submission, render a summary before the form, move focus to its named heading or container when that is the declared focus strategy, and provide keyboard-operable links that move focus to each invalid control","For asynchronous validation, expose the affected region as busy while results are incomplete and announce the final error or success once; do not announce every keystroke or duplicate inline and summary messages","On successful resubmission, remove stale errors, preserve a deterministic focus outcome, and announce completion only when the resulting context does not already communicate it"],"product_decisions":["async_announcement","error_association","error_summary","focus_strategy","success_feedback","validation_timing"],"functional_spec_bindings":["validation","messaging","states","focus","keyboard","lifecycle"],"implementation_outcomes":["error-summary","error-summary-focus","inline-error-association","validation-announcement","validation-associations","validation-busy-lifecycle","validation-state-lifecycle"],"evidence_routes":["unit","axe","e2e","human"]}
