name: Release

on:
  push:
    branches:
      - main
      - '2.x'

permissions:
  contents: write
  id-token: write

concurrency:
  group: accessibility-standards-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@11.1.1 --activate

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject aggregated breaking-change bodies
        run: pnpm release:preflight

      - name: Verify source and projections
        run: pnpm verify:ci

      - name: Pack and clean-install tarball
        run: node scripts/verify-packed-consumer.mjs

      - name: Inspect packed artifact
        run: npm publish --dry-run --ignore-scripts --tag development

      - name: Publish, tag, changelog, and GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release
